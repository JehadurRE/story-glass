<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Vibrant High-Luminosity Sunset Gradient -->
    <linearGradient id="markGrad" x1="8" y1="120" x2="120" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="28%" stop-color="#C13584"/>
      <stop offset="55%" stop-color="#FF0080"/>
      <stop offset="80%" stop-color="#FF4B2B"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>

    <!-- Glass Refraction Top Sheen -->
    <linearGradient id="markSheen" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Facebook Blue/Cyan Lens Prism Core -->
    <linearGradient id="markLensGlow" x1="44" y1="84" x2="84" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Ambient Shadow for App Icon usage -->
    <filter id="markShadow" x="-4" y="0" width="136" height="136" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#FF0080" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luminous Gradient Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#markGrad)" filter="url(#markShadow)"/>

  <!-- Top Glass Highlight Sheen -->
  <rect x="4" y="4" width="120" height="120" rx="34" fill="url(#markSheen)"/>
  <rect x="4" y="4" width="120" height="120" rx="34" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.5"/>

  <!-- Camera Outer Frame / Story Aperture -->
  <rect x="26" y="26" width="76" height="76" rx="22" stroke="#FFFFFF" stroke-width="8.4" fill="none"/>

  <!-- Inner Optical Story Lens -->
  <circle cx="64" cy="64" r="21" stroke="#FFFFFF" stroke-width="8.4" fill="none"/>

  <!-- Optical Prism Core with Facebook Blue/Cyan Reflection -->
  <circle cx="64" cy="64" r="15" fill="url(#markLensGlow)" fill-opacity="0.45"/>
  <path d="M52 62 A12 12 0 0 1 74 52 A13 13 0 0 0 52 62 Z" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- Story Live Status / Flash Dot -->
  <circle cx="87" cy="41" r="5.6" fill="#FFFFFF"/>
</svg>
