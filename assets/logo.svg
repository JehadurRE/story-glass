<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="4" y1="56" x2="56" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="28%" stop-color="#C13584"/>
      <stop offset="55%" stop-color="#FF0080"/>
      <stop offset="80%" stop-color="#FF4B2B"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E1306C"/>
      <stop offset="50%" stop-color="#FF4B2B"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="sheenH" x1="0" y1="0" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (56x56 at 6, 8) -->
  <g transform="translate(6, 8)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#logoGrad)"/>
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#sheenH)"/>
    <rect x="0" y="0" width="56" height="56" rx="16" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="11" y="11" width="34" height="34" rx="10" stroke="#FFFFFF" stroke-width="3.8" fill="none"/>
    <circle cx="28" cy="28" r="9.5" stroke="#FFFFFF" stroke-width="3.8" fill="none"/>
    <circle cx="28" cy="28" r="6.8" fill="#1877F2" fill-opacity="0.4"/>
    <path d="M23 27 A5 5 0 0 1 32 23 A5.5 5.5 0 0 0 23 27 Z" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="38" cy="18" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="76" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#0F172A">Story</tspan><tspan fill="url(#textGrad)">Glass</tspan>
  </text>
  <rect x="240" y="24" width="46" height="20" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="250" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">FREE</text>
</svg>
