<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E1306C"/>
      <stop offset="50%" stop-color="#FD1D1D"/>
      <stop offset="100%" stop-color="#FCAF45"/>
    </linearGradient>
    <linearGradient id="logoMarkGlow" x1="0" y1="80" x2="80" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#833AB4"/>
      <stop offset="0.3" stop-color="#C13584"/>
      <stop offset="0.6" stop-color="#E1306C"/>
      <stop offset="0.8" stop-color="#FD1D1D"/>
      <stop offset="1" stop-color="#FCAF45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="8" y1="8" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Left Mark (64x64 at 8,8) -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="64" height="64" rx="18" fill="#0E1118" stroke="#232936" stroke-width="1.5"/>
    <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#logoMarkGlow)"/>
    <rect x="6" y="6" width="52" height="52" rx="12" fill="#121622" fill-opacity="0.88" stroke="url(#sheen)" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="16" stroke="url(#logoMarkGlow)" stroke-width="4" fill="none"/>
    <circle cx="32" cy="32" r="10" fill="#1877F2" fill-opacity="0.25"/>
    <circle cx="32" cy="32" r="9.5" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2" fill="none"/>
    <path d="M14 20 C22 14 42 14 50 20 C42 26 22 26 14 20 Z" fill="#ffffff" fill-opacity="0.22"/>
    <circle cx="47" cy="18" r="3.5" fill="#FCAF45"/>
    <circle cx="47" cy="18" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Typographic Wordmark -->
  <text x="88" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#F4F5F8">Story</tspan><tspan fill="url(#textGrad)">Glass</tspan>
  </text>
  <text x="264" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8E99AF" letter-spacing="1.5">PRO</text>
  <circle cx="256" cy="32" r="3" fill="#10B981"/>
</svg>
