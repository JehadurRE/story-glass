<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="igGlow" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#833AB4"/>
      <stop offset="0.35" stop-color="#C13584"/>
      <stop offset="0.65" stop-color="#E1306C"/>
      <stop offset="0.85" stop-color="#FD1D1D"/>
      <stop offset="1" stop-color="#FCAF45"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="fbAccent" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1877F2"/>
      <stop offset="1" stop-color="#00C6FF"/>
    </linearGradient>
    <filter id="shadow" x="-8" y="-4" width="80" height="80" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#E1306C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0D0F15"/>
  
  <!-- Outer gradient story ring -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#igGlow)" filter="url(#shadow)"/>
  
  <!-- Glass inner card -->
  <rect x="9" y="9" width="46" height="46" rx="11" fill="#121520" fill-opacity="0.88"/>
  <rect x="9" y="9" width="46" height="46" rx="11" stroke="url(#glassSheen)" stroke-width="1.5"/>

  <!-- Camera / Story Aperture Ring -->
  <circle cx="32" cy="32" r="14" stroke="url(#igGlow)" stroke-width="3.5" fill="none"/>
  
  <!-- Lens Glass Center with FB tint reflection -->
  <circle cx="32" cy="32" r="9" fill="url(#fbAccent)" fill-opacity="0.25"/>
  <circle cx="32" cy="32" r="8" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2" fill="none"/>

  <!-- Glass Specular Reflection Highlight -->
  <path d="M12 18 C20 12 44 12 52 18 C44 26 20 26 12 18 Z" fill="#ffffff" fill-opacity="0.22"/>
  
  <!-- Story Active Indicator Glint -->
  <circle cx="45" cy="19" r="3.2" fill="#FCAF45"/>
  <circle cx="45" cy="19" r="1.5" fill="#ffffff"/>
</svg>
