<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant High-Luminosity Sunset Gradient -->
    <linearGradient id="sgGrad" x1="4" y1="60" x2="60" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="28%" stop-color="#C13584"/>
      <stop offset="55%" stop-color="#FF0080"/>
      <stop offset="80%" stop-color="#FF4B2B"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>

    <!-- Glass Refraction Sheen -->
    <linearGradient id="sgSheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Facebook Cyan/Blue Lens Glint -->
    <linearGradient id="lensGlow" x1="22" y1="42" x2="42" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1877F2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Luminous Gradient Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#sgGrad)"/>

  <!-- Top Glass Highlight Sheen -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#sgSheen)"/>
  <rect x="2" y="2" width="60" height="60" rx="17" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Camera Outer Frame / Story Aperture -->
  <rect x="13" y="13" width="38" height="38" rx="11" stroke="#FFFFFF" stroke-width="4.2" fill="none"/>

  <!-- Inner Optical Story Lens -->
  <circle cx="32" cy="32" r="10.5" stroke="#FFFFFF" stroke-width="4.2" fill="none"/>

  <!-- Optical Prism Core with Facebook Blue/Cyan Reflection -->
  <circle cx="32" cy="32" r="7.5" fill="url(#lensGlow)" fill-opacity="0.45"/>
  <path d="M26 31 A6 6 0 0 1 37 26 A6.5 6.5 0 0 0 26 31 Z" fill="#FFFFFF" fill-opacity="0.8"/>

  <!-- Story Live Status / Flash Dot -->
  <circle cx="43.5" cy="20.5" r="2.8" fill="#FFFFFF"/>
</svg>
